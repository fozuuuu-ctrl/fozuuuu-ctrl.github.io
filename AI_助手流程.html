<div class="tb" style="left:1003px;width:607px"><span style="color:#3b9bff">⏻</span><span>🌡</span><span>✦</span><span>⧉</span><span>◎</span></div><div class="tb" style="left:1626px;width:256px"><span>⚙</span><span>⊕</span></div>

<script>
const S={type:'AI',style:'均衡柔和',aroma:[],taste:'',adv:false,gen:false,cats:[],cup:'单杯',note:'',say:'',again:0,rec:false,rs:0,origin:'',sel:{},bt:false,tags:[],curve:0,asked:false,oname:''};
const svg=(pts,pts2,w=300,h=130)=>{const m=p=>p.map(([x,y])=>`${(x/33*w).toFixed(0)},${(h-y/12*h).toFixed(0)}`).join(' ');
return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><g stroke="#8883" stroke-dasharray="3 3">${[0,3,6,9,12].map(v=>`<line x1="0" x2="${w}" y1="${h-v/12*h}" y2="${h-v/12*h}"/>`).join('')}</g>${pts2?`<polyline fill="none" stroke="#888" stroke-dasharray="4 3" stroke-width="2" points="${m(pts2)}"/>`:''}<polyline fill="none" stroke="#4aa3ff" stroke-width="3.5" stroke-linejoin="round" points="${m(pts)}"/></svg>`};
const VAR=[[0,3],[7,3],[9,5],[12,7],[14,8],[28,8],[33,3]],CONST=[[0,9],[33,9]];
const OLD=[[0,3],[5,3],[8,6],[10,9],[22,9],[25,5],[30,5],[33,3]],NEW=[[0,3],[7,3],[9,5],[11,7],[13,8],[24,8],[26,4],[30,3.5],[33,3]];
const thumb=(pts,w=60,h=30)=>{const p=3,X=x=>p+x/33*(w-2*p),Y=y=>h-p-y/12*(h-2*p);let d=`M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=(X(x0)+X(x1))/2;d+=`C${mx.toFixed(1)} ${Y(y0).toFixed(1)} ${mx.toFixed(1)} ${Y(y1).toFixed(1)} ${X(x1).toFixed(1)} ${Y(y1).toFixed(1)}`}return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;flex:none"><path d="${d}" fill="none" stroke="#f5a300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const hd=(c,i,t,s)=>`<div class="ic" style="background:${c}">${i}</div><div><b>${t}</b><small>${s}</small></div>`;
const HN=hd('linear-gradient(135deg,#3b9bff,#2b6fe0)','✦','AI 新建曲线','根据豆子和目标风味生成曲线'),HO=hd('#2f7bff','⏱','AI 优化曲线','基于反馈调整现有曲线');
const ch=(a,on,fn)=>`<span class="ch ${on?'on':''}" onclick="${fn}">${a}</span>`;
const sel=(k,ph,opts)=>`<select class="inp" onchange="S.sel['${k}']=this.value"><option value="">${ph}</option>${opts.map(o=>`<option ${S.sel[k]==o?'selected':''}>${o}</option>`).join('')}</select>`;
const KEYS=['粉量','烘焙度','处理法','研磨度','生产日期'];
const TPL={粉量:'18',烘焙度:'中浅烘',处理法:'水洗',研磨度:'中细',生产日期:'烘焙后约 14 天'};
const OPT={烘焙度:['极浅烘','浅烘','中浅烘','中烘','中深烘','深烘'],处理法:['水洗','日晒','蜜处理','厌氧发酵','其他'],研磨度:['极细','细','中细','中等','中粗']};
const has=k=>!!String(S.sel[k]||'').trim();
const miss=()=>KEYS.filter(k=>!has(k));
const fin=k=>has(k)?String(S.sel[k]).trim():TPL[k];
const td=k=>k=='粉量'?TPL[k]+'g':TPL[k];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const beans=f=>{const g=k=>f?fin(k):S.sel[k],d=g('生产日期');return [S.origin,S.sel.产区,g('烘焙度'),g('处理法'),S.sel.品种,g('研磨度'),d?'生产日期 '+d:''].filter(Boolean).join(' / ')||'未填写'};
const tagR=r=>r?` <span class="tag">✓ 已识别</span>`:'';
const bot=t=>`<div class="msg">${t}</div>`;
const load=(a,b,c,next,back)=>`<div class="card" style="text-align:center"><div class="ic" style="width:48px;height:48px;margin:auto;background:linear-gradient(135deg,#3b9bff,#2b6fe0);font-size:22px">✦</div><ul class="ld" style="text-align:left;margin-top:10px"><li class="d">✓ ${a}</li><li class="a">● ${b}</li><li>○ ${c}</li></ul></div><button class="btn g" onclick="go(${back})">取消</button>`;
const typeLbl=()=>S.type=='AI'?'AI 自动选择':S.type;
const genChat=(c)=>{const m=miss(),d2=+fin('粉量')||18,water=S.sel.注水量||d2*3,bt=S.bt?' / 36g 目标液重':'',
 parU=typeLbl()+(has('粉量')?' / '+S.sel.粉量+'g 粉量':'')+(S.sel.注水量?' / '+S.sel.注水量+'g 注水量':'')+bt,
 parF=typeLbl()+' / '+d2+'g 粉量 / '+water+'g 注水量'+bt,
 fl=[S.style,S.aroma.join('、')].filter(Boolean).join(' / '),say=S.say?'<br>• 补充描述：'+S.say:'',fill=[];
 if(m.length)fill.push('• 关键信息未填写，已按模板填入：'+m.map(k=>k+' '+td(k)).join('、'));
 if(!S.sel.注水量)fill.push('• 总注水量：按 1:3 粉水比推荐 '+water+'g');
 if(S.type=='AI')fill.push('• 曲线类型：由 AI 根据豆子和口味选择');
 if(!S.origin&&!S.sel.产区&&!S.sel.品种)fill.push('• 产地/品种：未填写，按通用咖啡豆设计');
return `<div class="msg me">我已填写：<br>• 咖啡豆：${beans(0)}<br>• 萃取参数：${parU}<br>• 风味偏好：${fl}${say}</div>${bot('让我总结一下配置：<br>• 咖啡豆：'+beans(1)+'<br>• 萃取参数：'+parF+'<br>• 风味偏好：'+fl+say+'<br><br>'+(fill.length?'💡 AI 已为你补充以下推荐值：<br>'+fill.join('<br>')+'<br><br>':'')+(c?'确认无误后点击“确认生成”，也可以返回修改。':'现在开始为你生成萃取曲线…'))}`};
const optChat=()=>`<div class="msg me">${S.note?S.note:'我选择了：'+(S.tags.join('、')||'（未选择）')}</div>${bot(S.note?'好的，我会根据你的描述来优化曲线。':'好的，我将根据“'+(S.tags.join('、')||'通用建议')+'”这些反馈来优化你的曲线。')}`;
const OG=[['口感',['偏苦','偏酸','涩感']],['醇厚度',['太清淡','太厚重','缺乏层次']],['风味',['更多花香','更多果味','更多甜感','更少焦糊味','更多巧克力感','更多坚果感']],['萃取问题',['萃取过度（偏苦涩）','萃取不足（偏酸薄）','水流不均（通道效应）']]];

 const draw=()=>{const ok=p>=100;d.innerHTML=`<b style="font-size:15px;display:block;margin-bottom:6px">${ok?'✓ 测试完成':'测试中…'}</b><div style="font-size:13px;color:var(--mu)">「${esc(n)}」${ok?'已完整运行一遍，可根据口感决定保存、微调或重新生成。':'当前阶段：<span style="color:var(--or)">'+ph[p<20?0:p<45?1:p<85?2:3]+'</span>'}</div><div class="pg"><i style="width:${p}%"></i></div><div style="font-size:11px;color:var(--mu);margin-bottom:14px">${p}%　测试不会保存曲线</div><button class="btn ${ok?'':'g'}" onclick="hideDlg()">${ok?'完成':'停止测试'}</button>`};
 draw();clearInterval(tt);tt=setInterval(()=>{p=Math.min(100,p+4);draw();if(p>=100)clearInterval(tt)},250)}
function saveGen(){const n=((document.getElementById('cn')||{}).value||'').trim();if(!n){toast('请输入曲线名称');return}addGen();toast('已保存到「我的」')}
function saveOpt(){const n=(S.oname||'').trim();if(!n){toast('请输入曲线名称');return}if(lst.some(r=>r[0]==n)){toast('已存在同名曲线，请换个名称');return}const o=lst[Math.max(S.curve,0)];lst.unshift([n,o[1],0,o[3],NEW,'opt',o[6]||36]);S.curve=0;renderLst();toast('已保存为新曲线「'+n+'」，原曲线保持不变')}
function askCover(){const o=lst[Math.max(S.curve,0)];dlg('覆盖原曲线？','将用优化结果覆盖原曲线「<b style="color:var(--tx)">'+esc(o[0])+'</b>」。<br>覆盖后原曲线的参数将被替换，<b style="color:var(--tx)">无法恢复</b>。如需保留原曲线，请选择“保存为新曲线”。','确认覆盖',()=>{o[4]=NEW;o[5]=o[5]||'opt';o[6]=o[6]||36;renderLst();toast('已覆盖原曲线「'+o[0]+'」')},1)}
function tune(){addGen();S.again=0;S.tags=[];S.cats=[];S.note='';go(6)}
function submitOpt(){S.note='';go(7)}
function again(){S.again=1;S.tags=[];S.cats=[];S.note='';go(6)}
function sendM(){const i=document.getElementById('ft'),v=i.value.trim();if(!v)return;
 if(cur===1){S.say=v;parseSay(v);i.value='';draft('');submitNew();return}
 if(cur===2){S.say=(S.say?S.say+'；':'')+v;parseSay(v);i.value='';draft('');go(3);return}
 if(cur===6&&S.curve>=0){S.note=v;S.tags=[];S.cats=[];i.value='';draft('');go(7);return}const b=document.getElementById('bd');b.insertAdjacentHTML('beforeend','<div class="msg me"></div>');b.lastElementChild.textContent=v;i.value='';draft('');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})}
function closeAI(){hideDlg();if(document.getElementById('rc').classList.contains('on'))recEnd(0);open=false;render()}
function fit(){const b=document.getElementById('box'),w=b.clientWidth,k=w/1920;document.getElementById('stage').style.transform=`scale(${k})`;b.style.height=(1200*k)+'px'}
addEventListener('resize',fit);
let lst=[['流速预浸高萃','变压 36g / 168μm 600RPM',1,'埃塞 18g'],['意式深烘','变压 30g / 60μm 500RPM',1,'巴西 18g'],['拿铁','变压 25g',1,'哥伦比亚 18g'],['手动超浅','自由变压 50ml',0,'埃塞 16g'],['美式','变压 40g',1,'巴西 18g'],['超萃曲线','变压 110ml',0,'肯尼亚 20g'],['浅烘高萃','变压 65ml',0,'埃塞 18g']];
const SH=[VAR,OLD,NEW];
function pick(i){S.curve=S.curve===i?-1:i;renderLst()}
function renderLst(){document.getElementById('lst').innerHTML=lst.map((r,i)=>`<div class="li ${i===S.curve?'sel':''}" onclick="pick(${i})" style="cursor:pointer"><span class="n">${i+1}</span><div class="t"><b>${esc(r[0])}${r[2]?' <em>◉</em>':''}${r[5]?' <span class="ai">AI</span>':''}</b><small>${r[1]}${r[6]?' / '+r[6]+'ml':''}</small></div><span class="rb" ${r[5]?`onclick="event.stopPropagation();editCurve(${i})"`:''}>${r[5]?'✎':''}</span><span class="rb">◎</span><span class="rb">▶</span></div>`).join('')}
let ei=-1;
function editCurve(i){ei=i;const r=lst[i];document.getElementById('sdlg').innerHTML=`<h3>编辑曲线 <span class="ai" style="font-size:17px;padding:0 9px">AI</span></h3><div class="sl">曲线名称</div><input id="en" value="${esc(r[0])}"><div class="sl">杯量 (ml)</div><input id="eml" type="number" inputmode="decimal" value="${r[6]||36}"><div class="sh">AI 新建或优化的曲线仅可修改名称和杯量，不支持编辑具体参数。</div><div class="er" id="er"></div><div class="bt"><button onclick="closeEdit()">取消</button><button class="pr" onclick="saveEdit()">保存</button></div>`;document.getElementById('sm').classList.add('on')}
function closeEdit(){document.getElementById('sm').classList.remove('on');ei=-1}
function saveEdit(){const n=document.getElementById('en').value.trim(),ml=parseFloat(document.getElementById('eml').value),er=t=>document.getElementById('er').textContent=t;
 if(!n)return er('请输入曲线名称');if(lst.some((r,k)=>k!==ei&&r[0]==n))return er('已存在同名曲线，请换个名称');if(!(ml>0))return er('请输入有效的杯量（ml）');
 lst[ei][0]=n;lst[ei][6]=ml;closeEdit();renderLst()}
renderLst();
const grid=(y0,h,lab,c)=>{let g='';for(let k=0;k<=6;k++){const y=y0+h-k*h/6.2;g+=`<line x1="100" x2="1262" y1="${y}" y2="${y}" stroke="#2a2a2a"/><text x="38" y="${y+5}" fill="#777" font-size="16">${(k*2).toFixed(1)}</text>`}
 for(let t=0;t<=30;t+=5){const x=100+t*38.7;g+=`<text x="${x-6}" y="${y0+h+24}" fill="#777" font-size="16">${t}</text>`}return g+lab};
document.getElementById('ch').innerHTML=`<svg viewBox="0 0 1300 840" width="1300" height="840">${grid(40,190,'<text x="34" y="226" fill="#3b9bff" font-size="19">压力</text>')}${grid(298,190,'<text x="34" y="474" fill="#d9625b" font-size="19">流速</text><text x="34" y="498" fill="#8fd36b" font-size="19">液速</text>')}${grid(572,190,'<text x="34" y="750" fill="#e8d84a" font-size="19">流量</text><text x="34" y="774" fill="#ddd" font-size="19">液重</text>')}
<path d="M100 224 H580 V92 H1128 V170 H1262" fill="none" stroke="#3b7fd0" stroke-width="3" stroke-dasharray="9 6"/><path d="M100 465 H580 V474 H1262" fill="none" stroke="#7a3a3a" stroke-width="3" stroke-dasharray="9 6"/></svg>`;
render();fit();
