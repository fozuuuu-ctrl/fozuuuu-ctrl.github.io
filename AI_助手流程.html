<script>
const S={type:'AI',style:'均衡柔和',aroma:[],taste:'',adv:false,gen:false,cats:[],cup:'单杯',note:'',say:'',again:0,rec:false,rs:0,origin:'',sel:{},bt:false,tags:[],curve:0};
const svg=(pts,pts2,w=300,h=130)=>{const m=p=>p.map(([x,y])=>`${(x/33*w).toFixed(0)},${(h-y/12*h).toFixed(0)}`).join(' ');
return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><g stroke="#8883" stroke-dasharray="3 3">${[0,3,6,9,12].map(v=>`<line x1="0" x2="${w}" y1="${h-v/12*h}" y2="${h-v/12*h}"/>`).join('')}</g>${pts2?`<polyline fill="none" stroke="#888" stroke-dasharray="4 3" stroke-width="2" points="${m(pts2)}"/>`:''}<polyline fill="none" stroke="#4aa3ff" stroke-width="3.5" stroke-linejoin="round" points="${m(pts)}"/></svg>`};
const VAR=[[0,3],[7,3],[9,5],[12,7],[14,8],[28,8],[33,3]],CONST=[[0,9],[33,9]];

const thumb=(pts,w=60,h=30)=>{const p=3,X=x=>p+x/33*(w-2*p),Y=y=>h-p-y/12*(h-2*p);let d=`M${X(pts[0][0]).toFixed(1)} ${Y(pts[0][1]).toFixed(1)}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=(X(x0)+X(x1))/2;d+=`C${mx.toFixed(1)} ${Y(y0).toFixed(1)} ${mx.toFixed(1)} ${Y(y1).toFixed(1)} ${X(x1).toFixed(1)} ${Y(y1).toFixed(1)}`}return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;flex:none"><path d="${d}" fill="none" stroke="#f5a300" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};
const hd=(c,i,t,s)=>`<div class="ic" style="background:${c}">${i}</div><div><b>${t}</b><small>${s}</small></div>`;

const beans=()=>[S.origin,S.sel.产区,S.sel.烘焙度,S.sel.处理法,S.sel.品种,S.sel.研磨度].filter(Boolean).join(' / ')||'未填写';
const tagR=r=>r?` <span class="tag">✓ 已识别</span>`:'';

const load=(a,b,c,next,back)=>`<div class="card" style="text-align:center"><div class="ic" style="width:48px;height:48px;margin:auto;background:linear-gradient(135deg,#3b9bff,#2b6fe0);font-size:22px">✦</div><ul class="ld" style="text-align:left;margin-top:10px"><li class="d">✓ ${a}</li><li class="a">● ${b}</li><li>○ ${c}</li></ul></div><button class="btn g" onclick="go(${back})">取消</button>`;

const optChat=()=>`<div class="msg me">${S.note?S.note:'我选择了：'+(S.tags.join('、')||'（未选择）')}</div>${bot(S.note?'好的，我会根据你的描述来优化曲线。':'好的，我将根据“'+(S.tags.join('、')||'通用建议')+'”这些反馈来优化你的曲线。')}`;

function optGroups(){return `<div class="lb">想优化哪方面？（选填，可多选）</div><div class="row">${OG.map(g=>{const n=g[1].filter(t=>S.tags.includes(t)).length;return ch(g[0]+(n?' · '+n:''),S.cats.includes(g[0]),`tgc('${g[0]}')`)}).join('')}</div>`+OG.filter(g=>S.cats.includes(g[0])).map(g=>`<div class="lb">${g[0]}</div><div class="row">${g[1].map(t=>ch(t,S.tags.includes(t),`tg('tags','${t}')`)).join('')}</div>`).join('')}
const EX=[['偏苦','偏酸'],['太清淡','太厚重'],['萃取过度（偏苦涩）','萃取不足（偏酸薄）']];
const AR={'清爽明亮':['果香','甜感','花香'],'均衡柔和':['果香','甜感','坚果香'],'醇厚饱满':['巧克力','甜感','坚果香']};
const screens=[
 {g:'入口',n:'AI 助手入口',h:hd('#2f7bff','🤖','AI 助手','专属咖啡助手'),b:()=>`<div style="text-align:center;padding:6px 0"><div class="ic" style="width:56px;height:56px;margin:auto;background:#2f7bff;font-size:26px">🤖</div><b style="font-size:16px;display:block;margin-top:8px">AI 助手</b><div style="color:var(--mu);font-size:12px">我是你的专属咖啡助手，可以帮你创建和优化萃取曲线。</div></div>
  ${[['AI 新建曲线','根据豆子和目标风味生成曲线','linear-gradient(135deg,#3b9bff,#2b6fe0)','✦',1],['AI 优化曲线','基于反馈调整现有曲线','#2f7bff','⏱',5],['智能客服','咨询设备和使用问题','#22b35e','🎧'],['智能导购','推荐适合的豆子和配件','#a020f0','🛍'],['AI 咖啡师','咖啡知识和冲煮技巧','#e91e8c','☕']].filter(m=>m[4]/* 智能客服、智能导购、AI 咖啡师暂时隐藏 */).map(m=>`<button class="mod" ${m[4]?`onclick="go(${m[4]})"`:''}><div class="ic" style="background:${m[2]}">${m[3]}</div><div><b>${m[0]}</b><small>${m[1]}</small></div></button>`).join('')}`,f:'直接告诉我你想做什么，或点击上方卡片开始'},
 {g:'AI 新建曲线',n:'填写条件',h:HN,b:()=>`${bot('我将帮你创建一条新的萃取曲线。只需选一个你喜欢的口味，其余交给 AI 就行；也可以直接在下方说出你的想法，或拍照识别豆子。')}${S.rs>=1?bot('正在识别咖啡豆包装信息…'):''}${S.rs>=2?bot('📷 识别成功！已自动填充咖啡豆信息，可在「进阶条件」中查看和修改。'):''}<button class="btn p" onclick="startRec()">📷 拍照识别豆子信息</button>

 {g:'AI 优化曲线',n:'选择曲线',h:HO,b:()=>`${bot('请选择要优化的曲线：')}<div class="card" style="padding:4px 12px">${lst.map((r,i)=>`<div onclick="S.curve=${i};S.again=0;go(5)" style="display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;${i?'border-top:1px solid var(--bd)':''}">${thumb(r[4]||SH[i%3],56,28)}<div style="flex:1"><b style="display:block;font-size:13px">${r[0]}</b><small style="color:var(--mu)">${r[3]} · ${r[1]}</small></div><span style="color:${i===S.curve?'var(--or)':'transparent'};font-size:16px">✓</span></div>`).join('')}</div><button class="btn g" onclick="go(5)">返回</button>`,f:'或直接输入你的反馈…'},
 {g:'AI 优化曲线',n:'选择问题',h:HO,b:()=>`${S.curve<0?`<div class="card" onclick="go(4)" style="display:flex;gap:10px;align-items:center;justify-content:space-between;cursor:pointer;border-style:dashed"><div><b>选择要优化的曲线</b><br><small style="color:var(--mu)">请先选择一条曲线再提交优化</small></div><span style="color:var(--or);font-size:18px">›</span></div>`:`<div class="card" onclick="go(4)" style="display:flex;gap:10px;align-items:center;cursor:pointer">${thumb(lst[S.curve][4]||SH[S.curve%3],64,32)}<div style="flex:1"><small style="color:var(--mu)">正在优化</small><br><b>${lst[S.curve][0]}</b><br><small style="color:var(--mu)">${lst[S.curve][3]}${S.again?' · <span style="color:var(--or)">基于上一轮优化结果</span>':''}</small></div><span style="color:var(--or);font-size:12px;white-space:nowrap">更换 ›</span></div>`}${bot(S.curve<0?'请先选择要优化的曲线。想从哪些方面优化？':'我将帮你优化“'+lst[S.curve][0]+'”。想从哪些方面优化？选择方向后再选具体问题（相反的选项只能选其一）；也可以直接提交，或直接告诉我哪里不满意：')}

let cur=0,open=false;
function fillDef(){S.type=S.type||'AI';S.style=S.style||'均衡柔和'}
function go(i){if(i===2||i===3)fillDef();if(i===2){S.gen=false;S.cup='单杯'}cur=i;open=true;render()}
function tg(k,t){const a=S[k],i=a.indexOf(t);if(i<0){if(k=='tags')EX.forEach(p=>{if(p.includes(t))p.forEach(o=>{const j=a.indexOf(o);if(j>=0)a.splice(j,1)})});a.push(t)}else a.splice(i,1);render()}
let at=null;
function render(){clearTimeout(at);const sc=screens[cur];document.getElementById('hd').innerHTML=sc.h+'<div class="x" onclick="closeAI()">✕</div>';const bd=document.getElementById('bd'),y=bd.scrollTop;bd.innerHTML=sc.b();bd.scrollTop=y;{const r=document.getElementById('res');if(r)setTimeout(()=>r.scrollIntoView({behavior:'smooth',block:'start'}),60);const au=typeof sc.auto=='function'?sc.auto():sc.auto;if(au!=null){setTimeout(()=>bd.scrollTo({top:bd.scrollHeight,behavior:'smooth'}),60);at=setTimeout(()=>{if(open&&cur===screens.indexOf(sc))go(au)},2800)}}document.getElementById('ft').placeholder=sc.f;
 document.getElementById('stage').classList.toggle('open',open);
 let last='',h='';screens.forEach((s,i)=>{if(s.g!==last){h+=`<span class="grp">${s.g}</span>`;last=s.g}h+=`<button class="st ${open&&i===cur?'on':''}" onclick="go(${i})"><i>${i+1}</i>${s.n}</button>`});document.getElementById('nav').innerHTML=h}
function startRec(){if(S.rs===1)return;S.rs=1;S.rec=false;render();const b=document.getElementById('bd');b.scrollTo({top:0,behavior:'smooth'});
 setTimeout(()=>{S.rs=2;S.rec=true;S.adv=true;S.origin='埃塞俄比亚';Object.assign(S.sel,{产区:'耶加雪菲',烘焙度:'浅烘',处理法:'水洗',品种:'74110',生产日期:'2024/03/15'});render();const a=document.getElementById('adv');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})},1600)}
let rt=null,rs=0;
function rec(){rs=0;document.getElementById('rt').textContent='录音中... 0s';document.getElementById('fz').style.display='none';document.getElementById('rc').classList.add('on');clearInterval(rt);rt=setInterval(()=>{rs++;document.getElementById('rt').textContent='录音中... '+rs+'s'},1000)}
function recEnd(ok){clearInterval(rt);document.getElementById('rc').classList.remove('on');document.getElementById('fz').style.display='flex';if(ok){const i=document.getElementById('ft');i.value='这是通过语音识别的文本内容';draft(i.value);i.focus()}}
function draft(v){document.getElementById('sd').classList.toggle('on',!!v.trim())}
function addGen(){const n=(document.getElementById('cn')||{}).value||'新曲线';lst=lst.filter(r=>r[5]!='gen');lst.unshift([n,'AI 生成 / '+S.cup,0,(S.origin?S.origin.slice(0,2):'埃塞')+' 18g',S.type!='恒压曲线'?VAR:CONST,'gen']);S.curve=0;renderLst()}
function tune(){addGen();S.again=0;S.tags=[];S.cats=[];S.note='';go(5)}
function submitOpt(){S.note='';go(6)}
function again(){S.again=1;S.tags=[];S.cats=[];S.note='';go(5)}
function sendM(){const i=document.getElementById('ft'),v=i.value.trim();if(!v)return;
 if(cur===1){S.say=v;i.value='';draft('');go(2);return}
 if(cur===5&&S.curve>=0){S.note=v;S.tags=[];S.cats=[];i.value='';draft('');go(6);return}const b=document.getElementById('bd');b.insertAdjacentHTML('beforeend','<div class="msg me"></div>');b.lastElementChild.textContent=v;i.value='';draft('');b.scrollTo({top:b.scrollHeight,behavior:'smooth'})}
function closeAI(){if(document.getElementById('rc').classList.contains('on'))recEnd(0);open=false;render()}

addEventListener('resize',fit);

renderLst();
document.getElementById('lst').innerHTML=lst.map((r,i)=>`<div class="li ${i?'':'sel'}"><span class="n">${i+1}</span><div class="t"><b>${r[0]}${r[2]?' <em>◉</em>':''}</b><small>${r[1]}</small></div><span class="rb">◎</span><span class="rb">▶</span></div>`).join('');
const grid=(y0,h,lab,c)=>{let g='';for(let k=0;k<=6;k++){const y=y0+h-k*h/6.2;g+=`<line x1="100" x2="1262" y1="${y}" y2="${y}" stroke="#2a2a2a"/><text x="38" y="${y+5}" fill="#777" font-size="16">${(k*2).toFixed(1)}</text>`}
 for(let t=0;t<=30;t+=5){const x=100+t*38.7;g+=`<text x="${x-6}" y="${y0+h+24}" fill="#777" font-size="16">${t}</text>`}return g+lab};

<path d="M100 224 H580 V92 H1128 V170 H1262" fill="none" stroke="#3b7fd0" stroke-width="3" stroke-dasharray="9 6"/><path d="M100 465 H580 V474 H1262" fill="none" stroke="#7a3a3a" stroke-width="3" stroke-dasharray="9 6"/></svg>`;
render();fit();
